name: "✨ Feature Request"
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Cross-platform GUI
        - PowerShell CLI
        - Windows GUI
        - macOS support
        - Microsoft Entra
        - Exchange Online / RBAC
        - Security
        - Documentation
        - Automation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways to solve the problem?

  - type: dropdown
    id: priority
    attributes:
      label: Importance
      options:
        - Nice to have
        - Useful
        - Important
        - Blocking my use case

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, screenshots, Microsoft documentation links, or other useful information.
